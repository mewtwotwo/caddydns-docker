name: Build and Push Caddy Docker Image

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force rebuild even when upstream digest is unchanged
        required: false
        type: boolean
        default: false

  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: caddy-alidns-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Read last upstream digest
        id: state
        run: |
          if [ -f .caddy-digest ]; then
            echo "digest=$(cat .caddy-digest)" >> "$GITHUB_OUTPUT"
          else
            echo "digest=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get latest caddy:alpine digest
        id: upstream
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect caddy:alpine | awk '/Digest:/ {print $2; exit}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.state.outputs.digest }}" = "${{ steps.upstream.outputs.digest }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip build
        if: steps.decide.outputs.changed == 'false'
        run: echo "Upstream digest unchanged, skip build."

      - name: Log in to Docker Hub
        if: steps.decide.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        if: steps.decide.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          tags: |
            linkmew/caddy-alidns:latest
            linkmew/caddy-alidns:httpport

      - name: Persist upstream digest
        if: steps.decide.outputs.changed == 'true' && success()
        run: |
          echo "${{ steps.upstream.outputs.digest }}" > .caddy-digest

      - name: Commit digest sync
        if: steps.decide.outputs.changed == 'true' && success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync caddy digest"
          file_pattern: .caddy-digest
